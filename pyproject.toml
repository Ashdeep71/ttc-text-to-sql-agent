[project]
name = "transitquery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashdeep Singh", email = "ashdeepsingh81@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "mcp>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlglot>=30.19.0",
]

[project.scripts]
transitquery = "transitquery:main"

[project.optional-dependencies]
etl = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]
agent = [
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
]
api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
